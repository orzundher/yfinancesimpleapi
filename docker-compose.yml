services:
  yfinance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yfinance-api
    ports:
      - "3010:3010"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
